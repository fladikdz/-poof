name: Build iOS Companion

on:
  push:
    branches: [main, master]
    paths:
      - 'ios-companion/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    # macos-15 ships Xcode 16, which is what current xcodegen targets
    # (project format 77). macos-14 has only Xcode 15.4, which can't open
    # newer .xcodeproj formats.
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-companion
        run: |
          xcodegen generate
          ls -la

      - name: Build .app (unsigned)
        working-directory: ios-companion
        run: |
          set -o pipefail
          xcodebuild \
            -project poof-ios.xcodeproj \
            -scheme poof-ios \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      - name: Upload xcodebuild log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios-companion/xcodebuild.log
          if-no-files-found: warn

      - name: Package as .ipa
        working-directory: ios-companion/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -R poof-ios.app Payload/
          zip -qr poof-ios.ipa Payload
          ls -lh poof-ios.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: poof-ios-unsigned-ipa
          path: ios-companion/build/Build/Products/Release-iphoneos/poof-ios.ipa
          if-no-files-found: error

      - name: Attach to release (on release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ios-companion/build/Build/Products/Release-iphoneos/poof-ios.ipa
