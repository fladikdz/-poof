# XcodeGen project spec for poof-ios — sideloadable iOS Companion App.
#
# Builds via GitHub Actions on macOS runner (we don't need a Mac locally).
# Generates poof-ios.xcodeproj on demand from this YAML.

name: poof-ios

options:
  bundleIdPrefix: com.poof
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.poof.companion
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""           # unsigned by default; AltStore signs at install time
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  poof-ios:
    type: application
    platform: iOS
    sources:
      - path: Sources/poof-ios
    resources:
      - path: Resources
        excludes:
          - "*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/poof-ios.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: poof companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - bluetooth-le
        UIBackgroundModes:
          - bluetooth-peripheral
          - bluetooth-central
          - location
        NSLocationAlwaysAndWhenInUseUsageDescription:
          Used to display where iOS thinks the device is, so the desktop app can
          show drift between the spoofed and real coordinates.
        NSLocationWhenInUseUsageDescription:
          Used to display the current iOS-reported location for drift monitoring.
        NSBluetoothAlwaysUsageDescription:
          Acts as a Bluetooth peripheral emulating a Pokemon Go Plus accessory,
          and as a Bluetooth central to communicate with the desktop companion.
        NSMotionUsageDescription:
          Detects stationary vs moving state for accurate drift warnings.
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIRequiresPersistentWiFi: false
