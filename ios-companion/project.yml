# XcodeGen project spec for poof-ios — sideloadable iOS Companion App.
#
# Builds via GitHub Actions on macOS runner (we don't need a Mac locally).
# Generates poof-ios.xcodeproj on demand from this YAML.

name: poof-ios

options:
  bundleIdPrefix: com.poof
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  # Pin Xcode project file format to one Xcode 15.4+ can read, so newer
  # xcodegen versions don't generate a format only Xcode 16 understands.
  xcodeVersion: "15.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.poof.companion
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"  # iPhone + iPad
    ENABLE_BITCODE: "NO"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""           # unsigned by default; AltStore signs at install time
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  poof-ios:
    type: application
    platform: iOS
    sources:
      - path: Sources/poof-ios
    # NB: Info.plist and entitlements are referenced via build settings, NOT
    # bundled as resources — otherwise xcodebuild gets two conflicting plists.
    resources: []
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/poof-ios.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        GENERATE_INFOPLIST_FILE: "NO"        # use our hand-written Info.plist
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: "YES"
